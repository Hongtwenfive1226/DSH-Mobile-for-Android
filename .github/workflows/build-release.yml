name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 直接用 GitHub runner 预装的 Android SDK（ANDROID_HOME 已由镜像设置），
      # 不再依赖 android-actions/setup-android：v3 是 Node20 旧版，在 Node24 runner 上会失败。
      # 镜像已含 platforms;android-37.0 与 build-tools;37.0.0，这里只补装缺的 NDK 与 cmake。
      - name: Install missing Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${SM:-}" ] || [ ! -x "$SM" ]; then
            echo "sdkmanager not found under $SDK"; ls -R "$SDK/cmdline-tools" || true; exit 1
          fi
          "$SM" --version
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      # 本地锁文件/包装器面向国内网络，GitHub 机器上换成官方源。
      - name: Normalize npm registry (npmmirror -> npmjs)
        run: sed -i 's|registry.npmmirror.com|registry.npmjs.org|g' package-lock.json

      - name: Normalize Gradle distribution (Tencent -> services.gradle.org)
        run: sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build release APK (arm64-v8a)
        id: build
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # 构建失败时把日志尾部写进 job summary（summary 可被公开 API 读取，便于远程排查）
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "## Gradle build failed"
            echo ""
            echo "### Environment"
            echo '```'
            java -version 2>&1 || true
            echo "ANDROID_HOME=$ANDROID_HOME"
            df -h / /home 2>/dev/null || df -h || true
            echo '```'
            echo ""
            echo "### Last 150 log lines"
            echo '```'
            tail -n 150 /tmp/gradle-build.log 2>/dev/null || echo '(no log)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
